apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-python-app
  labels:
    app: sample-python-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-python-app
  template:
    metadata:
      labels:
        app: sample-python-app
    spec:
      containers:
      - name: example-container
        image: examples/ptyhon-sample-app-demo:v1 # image we have create from Dockerfile "docker build -t examples/python-sample-app-demo:v1"
        ports:
        - containerPort: 80
